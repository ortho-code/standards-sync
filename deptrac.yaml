# Enforces the hexagonal-light layering: Core is pure, adapters live at the edges.
# @see https://deptrac.github.io/deptrac/

deptrac:
  paths:
    - ./src
  layers:
    # The pure pipeline: ports (the Filesystem interface) and value objects. Must not touch any framework.
    - name: Core
      collectors:
        - type: directory
          value: src/Core/.*
        - type: classNameRegex
          value: '#^AlleKnalle\\StandardsSync\\Core\\#'
    # Format-editing machinery shared across rule families (neon today); the engine stays format-blind.
    - name: Formats
      collectors:
        - type: directory
          value: src/Formats/.*
        - type: classNameRegex
          value: '#^AlleKnalle\\StandardsSync\\Formats\\#'
    # The shipped rule library: concrete rules per mechanism (Block) or per tool (PhpStan), built on the Core contract.
    # Core must never reference a concrete rule; the reverse edge is the open/closed promise, checked.
    - name: Rules
      collectors:
        - type: bool
          must:
            - type: directory
              value: src/Rules/.*
          must_not:
            - type: directory
              value: src/Rules/Composer/.*
    # The composer family, the one rule family allowed vendor code: composer's own semver library is the authority on
    # version constraints, and composer is not an optional tool — every consumer installed this engine with it.
    # Scoped to this directory so every other family stays provably vendor-free.
    - name: ComposerRules
      collectors:
        - type: directory
          value: src/Rules/Composer/.*
    # Config-build-time support for authoring org packages: the self-locating Package and the Standard base rule set.
    - name: Authoring
      collectors:
        - type: directory
          value: src/Authoring/.*
        - type: classNameRegex
          value: '#^AlleKnalle\\StandardsSync\\Authoring\\#'
    # Driven adapters: the Symfony-backed Filesystem implementation of the Core port.
    - name: Infrastructure
      collectors:
        - type: directory
          value: src/Infrastructure/.*
        - type: classNameRegex
          value: '#^AlleKnalle\\StandardsSync\\Infrastructure\\#'
    # Driving adapters: the console delivery mechanism and its drift report.
    - name: Presentation
      collectors:
        - type: directory
          value: src/Presentation/.*
        - type: classNameRegex
          value: '#^AlleKnalle\\StandardsSync\\Presentation\\#'
    # Shipped test scaffolding: the framework-neutral SyncTester org packages use to test their own config.
    - name: Testing
      collectors:
        - type: directory
          value: src/Testing/.*
        - type: classNameRegex
          value: '#^AlleKnalle\\StandardsSync\\Testing\\#'
    # Any class outside our own namespace, i.e. every third-party dependency (Symfony today); keeps Core provably free of vendor code.
    - name: Vendor
      collectors:
        - type: classNameRegex
          value: '#^(?!AlleKnalle\\StandardsSync\\)[^\\]+\\#'
  ruleset:
    Core: ~
    Authoring:
      - Core
      - Vendor
    Formats:
      - Core
    Rules:
      - Core
      - Formats
    ComposerRules:
      - Core
      - Formats
      - Vendor
    Infrastructure:
      - Core
      - Vendor
    Presentation:
      - Core
      - Infrastructure
      - Vendor
    Testing:
      - Core
      - Infrastructure
      - Vendor
    Vendor: ~
