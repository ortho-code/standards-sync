name: CI

# What the shared standard's own workflow does not cover. Everything else — the style, analysis and test runs — is `composer app-checks` in standards.yml.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Manifest
        run: composer validate --strict
      - name: Architecture
        run: composer deptrac
      # Composer puts a dependency's binaries on the script PATH, never the root package's own, so this repository cannot run the standard's `app-sync-check`; it invokes the same check directly instead.
      - name: Standard
        run: php bin/standards-sync sync --check
