on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - run: make
  deploy:
    needs: [build, lint]
    if: ${{ github.event_name == 'push' }}
    runs-on: [ubuntu-28.04]
    environment:
      name: production
      url: https://acme.example
    steps:
      - id: deploy
        run: make deploy
  lint:
    runs-on: ubuntu-26.04
    steps:
      - run: make lint
