name: Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - id: checkout
        uses: actions/checkout@v7
      # setup-php before the install
      - id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - id: install
        uses: ramsey/composer-install@v4
      - id: checks
        run: composer app-checks --verbose
